<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
	<link rel="stylesheet" href="style.css">

	<style>
		/* Auth fade-out target + dashboard extras */
		.container {
			opacity: 1;
			transition: opacity 0.5s ease-out;
		}
		.container.fade-out {
			opacity: 0;
		}

		.card-feed {
			background: var(--light);
			border-radius: 20px;
			padding: 24px;
			margin-top: 24px;
			box-shadow: 0 2px 5px rgba(0,0,0,0.05);
		}

		.card-feed h3 {
			margin: 0 0 12px 0;
			font-size: 16px;
		}

		#server-status.good {
			color: #2e7d32;
		}

		#server-status.bad {
			color: var(--red);
		}
	</style>

	<title>AdminHub</title>
</head>
<body>
	<!-- SIDEBAR -->
	<section id="sidebar">
		<a href="#" class="brand">
			<i class='bx bx-home-smile bx-lg'></i>
			<span class="text">Admin Portal</span>
		</a>
		<ul class="side-menu top">
			<li class="active">
				<a href="#">
					<i class='bx bxs-dashboard bx-sm' ></i>
					<span class="text">Dashboard</span>
				</a>
			</li>
			<li>
				<a href="../statistics/index.html">
					<i class='bx bx-stats bx-sm'></i>
					<span class="text">Statistics</span>
				</a>
			</li>
			<li>
				<a href="../products/index.html">
					<i class='bx bxs-cart bx-sm'></i>
					<span class="text">Products</span>
				</a>
			</li>
			<li>
				<a href="../docs/index.html">
					<i class='bx bxs-file-doc bx-sm' ></i>
					<span class="text">Documents</span>
				</a>
			</li>
		</ul>
		<ul class="side-menu bottom">
			<li>
				<a href="#" class="logout" id="logoutButton">
					<i class='bx bx-power-off bx-sm bx-burst-hover' ></i>
					<span class="text">Logout</span>
				</a>
			</li>
		</ul>
	</section>
	<!-- SIDEBAR -->

	<!-- CONTENT -->
	<section id="content">
		 <!-- NAVBAR -->
        <nav>
            <i class='bx bx-menu'></i> 
        </nav>
        <!-- NAVBAR -->

		<!-- MAIN -->
		<main>
			<div class="container">
				<div class="head-title">
					<div class="left">
						<h1>Dashboard</h1>
					</div>
				</div>

				<ul class="box-info">
					<li>
						<i class='bx bxs-server'></i>
						<span class="text">
							<h3 id="server-status">Checking…</h3>
							<p id="server-status-headline">Server Status</p>
						</span>
					</li>
					<li>
						<i class='bx bx-calendar-star'></i>
						<span class="text">
							<h3>Since Mar 15, 2025</h3>
							<p>Reliable statistics window</p>
						</span>
					</li>
				</ul>

				<div class="card-feed">
					<h3>Community Feed</h3>
					<div class="tagembed-widget" style="width:100%; height:100%;" data-widget-id="2161454" data-tags="false" view-url="https://widget.tagembed.com/2161454"></div>
					<script src="https://widget.tagembed.com/embed.min.js" type="text/javascript"></script>
				</div>
			</div>
		</main>
		<!-- MAIN -->
	</section>
	<!-- CONTENT -->

	<script src="/js/config.js"></script>
    <script src="/js/auth_script.js"></script>
	<script src="home_script.js"></script>
</body>
</html>
