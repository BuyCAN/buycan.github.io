<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
	<link rel="stylesheet" href="../home/style.css">

	<title>Brand Submissions</title>

	<style>
		.container { opacity: 1; transition: opacity 0.5s ease-out; }
		.container.fade-out { opacity: 0; }
		[hidden] { display: none !important; }

		.review-workspace {
			display: flex;
			gap: 16px;
			align-items: flex-start;
		}
		.queue-col {
			width: 32%;
			min-width: 260px;
			background: var(--light);
			border-radius: 12px;
			padding: 1em;
			position: sticky;
			top: 72px;
			max-height: calc(100vh - 100px);
			overflow-y: auto;
		}
		.detail-col {
			flex: 1;
			min-width: 0;
			background: var(--light);
			border-radius: 12px;
			padding: 1em;
		}

		.queue-filters { display: flex; flex-wrap: wrap; gap: 0.5em; margin-bottom: 0.75em; }
		.queue-filters select, .queue-filters input {
			padding: 0.4em; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9em;
		}
		.queue-filters input { flex: 1; min-width: 120px; }
		.btn {
			padding: 0.5em 1em; border-radius: 8px; border: none; cursor: pointer;
			font-weight: bold; font-size: 0.9em; background: var(--blue); color: #fff;
		}
		.btn:hover { opacity: 0.85; }
		.btn:disabled { opacity: 0.5; cursor: wait; }
		.btn.outline { background: transparent; color: var(--blue); border: 1px solid var(--blue); }
		.btn.approve { background: #2e7d32; }
		.btn.reject { background: var(--red); }

		.queue-status { font-size: 0.85em; color: #888; min-height: 1.2em; margin-bottom: 0.5em; }
		.queue-item {
			border: 1px solid #ddd; border-radius: 8px; padding: 0.6em 0.7em; margin-bottom: 0.5em;
			cursor: pointer; background: #fff; display: block; width: 100%; text-align: left; font: inherit;
		}
		.queue-item:hover { background: #f5f5f5; }
		.queue-item.selected { background: var(--light-blue); border-color: var(--blue); }
		.queue-item .qi-top { display: flex; justify-content: space-between; gap: 0.5em; font-weight: bold; font-size: 0.92em; }
		.queue-item .qi-sub { font-size: 0.82em; color: #555; margin-top: 0.2em; overflow-wrap: anywhere; }

		.badge {
			display: inline-block; font-size: 0.75em; font-weight: bold; padding: 0.1em 0.5em;
			border-radius: 10px; background: #eee; color: #333; white-space: nowrap;
		}
		.badge.new { background: var(--light-orange); color: #a63b00; }
		.badge.correction { background: var(--light-blue); color: #1b5e9a; }
		.badge.pending { background: var(--light-yellow); color: #7a5b00; }
		.badge.approved { background: #d7f0da; color: #1e5e24; }
		.badge.rejected, .badge.superseded { background: #f3d6d5; color: #8c2420; }
		.badge.increase { background: var(--light-orange); color: #a63b00; }

		.detail-empty { color: #888; padding: 2em 0; text-align: center; }
		.detail-section {
			background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 1em; margin-bottom: 1em;
		}
		.detail-section h2 { font-size: 1.05em; color: var(--blue); margin-bottom: 0.6em; }
		.detail-head h2 { font-size: 1.2em; color: var(--dark); display: flex; flex-wrap: wrap; gap: 0.5em; align-items: center; }
		.detail-head .meta { font-size: 0.85em; color: #666; margin-top: 0.3em; }

		.warning-box {
			background: #fff3cd; border: 2px solid #e0a800; color: #5c4400; border-radius: 10px;
			padding: 0.9em 1em; margin-bottom: 1em; font-weight: bold;
		}
		.warning-box p { font-weight: normal; margin-top: 0.3em; }
		.info-box { background: #eef6ff; border: 1px solid #b6d6f7; border-radius: 10px; padding: 0.8em 1em; margin-bottom: 1em; font-size: 0.92em; }

		dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 0.3em 1em; font-size: 0.9em; }
		dl.kv dt { font-weight: bold; color: #555; }
		dl.kv dd { overflow-wrap: anywhere; }
		.hint-good { color: #2e7d32; font-weight: bold; }
		.hint-bad { color: #b35c00; font-weight: bold; }
		.muted { color: #888; font-size: 0.85em; }

		.diff-wrap { overflow-x: auto; }
		table.diff { width: 100%; border-collapse: collapse; font-size: 0.88em; }
		table.diff th, table.diff td { border-bottom: 1px solid #eee; padding: 0.5em; text-align: left; vertical-align: top; }
		table.diff th { background: #fafafa; font-size: 0.85em; color: #555; }
		table.diff td.val { overflow-wrap: anywhere; max-width: 260px; white-space: pre-wrap; }
		table.diff tr.unchanged td { color: #999; }
		table.diff tr.increase td { background: #fff1e8; }
		table.diff tr.increase td:first-child { border-left: 4px solid var(--orange); }
		table.diff tr.excluded td.val.proposed { text-decoration: line-through; color: #999; }
		table.diff input[type="text"], table.diff input[type="number"] {
			width: 100%; min-width: 120px; padding: 0.35em; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em;
		}

		.link-list li { list-style: disc; margin-left: 1.2em; margin-bottom: 0.3em; overflow-wrap: anywhere; font-size: 0.9em; }
		.link-list a, .ext-link { color: var(--blue); text-decoration: underline; overflow-wrap: anywhere; }

		.checklist label { display: flex; gap: 0.5em; align-items: flex-start; margin-bottom: 0.5em; font-size: 0.92em; }
		.checklist input { margin-top: 0.25em; }

		.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1em; }
		.field { display: block; margin-bottom: 0.7em; font-size: 0.88em; font-weight: bold; }
		.field input[type="text"], .field textarea {
			display: block; width: 100%; margin-top: 0.25em; padding: 0.5em; border: 1px solid #ccc;
			border-radius: 6px; font-size: 0.95em; font-weight: normal; font-family: inherit;
		}
		.field textarea { min-height: 70px; }
		.check-field { display: flex; gap: 0.5em; align-items: flex-start; font-size: 0.88em; margin-bottom: 0.7em; }
		.check-field input { margin-top: 0.2em; }
		.check-field.company { background: #fff8e1; border: 1px solid #f0d68a; border-radius: 8px; padding: 0.6em; }

		.action-msg { margin-top: 0.6em; font-weight: bold; font-size: 0.92em; white-space: pre-wrap; }
		.action-msg.ok { color: #2e7d32; }
		.action-msg.err { color: var(--red); }
		.page-msg { margin-bottom: 1em; }

		pre.json { background: #f6f6f6; border-radius: 8px; padding: 0.7em; font-size: 0.8em; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }

		@media screen and (max-width: 900px) {
			.review-workspace { flex-direction: column; }
			.queue-col { width: 100%; min-width: 0; position: static; max-height: 45vh; }
			.detail-col { width: 100%; }
			.action-grid { grid-template-columns: 1fr; }
		}
		@media screen and (max-width: 576px) {
			dl.kv { grid-template-columns: 1fr; }
			dl.kv dt { margin-top: 0.4em; }
		}
	</style>
</head>
<body>

	<!-- SIDEBAR -->
	<section id="sidebar">
		<a href="#" class="brand">
			<i class='bx bx-home-smile bx-lg'></i>
			<span class="text">Admin Portal</span>
		</a>
		<ul class="side-menu top">
			<li>
				<a href="../home/index.html">
					<i class='bx bxs-dashboard bx-sm' ></i>
					<span class="text">Dashboard</span>
				</a>
			</li>
			<li>
				<a href="../statistics/index.html">
					<i class='bx bx-stats bx-sm'></i>
					<span class="text">Statistics</span>
				</a>
			</li>
			<li>
				<a href="../products/index.html">
					<i class='bx bxs-cart bx-sm'></i>
					<span class="text">Products</span>
				</a>
			</li>
			<li class="active">
				<a href="#">
					<i class='bx bxs-inbox bx-sm'></i>
					<span class="text">Brand Submissions</span>
				</a>
			</li>
			<li>
				<a href="../docs/index.html">
					<i class='bx bxs-file-doc bx-sm' ></i>
					<span class="text">Documents</span>
				</a>
			</li>
		</ul>
		<ul class="side-menu bottom">
			<li>
				<a href="#" class="logout" id="logoutButton">
					<i class='bx bx-power-off bx-sm bx-burst-hover' ></i>
					<span class="text">Logout</span>
				</a>
			</li>
		</ul>
	</section>
	<!-- SIDEBAR -->

	<section id="content">
		<nav>
			<i class='bx bx-menu'></i>
		</nav>

		<main>
			<div class="container">
				<div class="head-title">
					<div class="left">
						<h1>Brand Submissions</h1>
					</div>
				</div>

				<div class="review-workspace">
					<!-- Queue -->
					<div class="queue-col">
						<div class="queue-filters">
							<select id="status-filter" aria-label="Status">
								<option value="pending">Pending</option>
								<option value="approved">Approved</option>
								<option value="rejected">Rejected</option>
								<option value="superseded">Superseded</option>
								<option value="all">All</option>
							</select>
							<input type="text" id="barcode-filter" placeholder="Barcode (optional)" inputmode="numeric" aria-label="Barcode filter">
							<button class="btn" id="refresh-button" type="button">Refresh</button>
						</div>
						<div class="queue-status" id="queue-status"></div>
						<div id="queue-list"></div>
					</div>

					<!-- Detail -->
					<div class="detail-col">
						<div class="action-msg page-msg" id="page-msg"></div>
						<div id="detail"><p class="detail-empty">Select a submission from the queue.</p></div>
					</div>
				</div>
			</div>
		</main>
	</section>

	<script src="/js/config.js"></script>
	<script src="/js/auth_script.js"></script>
	<script src="/js/brand_review.js"></script>
	<script src="../home/home_script.js"></script>
</body>
</html>
