<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get BuyCAN</title>

<!-- Open Graph: controls the preview card in Messages, WhatsApp, Slack etc. -->
<meta property="og:title" content="BuyCAN">
<meta property="og:description" content="Scan a barcode. See how Canadian it really is.">
<meta property="og:url" content="https://buycan.github.io/get">

<script>
/*
 * Runs in <head>, before the body renders.
 *
 * On a phone this calls location.replace() while the parser is still working,
 * so the browser navigates away without ever painting this page. Putting it at
 * the end of <body> instead makes the fallback UI flash first.
 *
 * replace() rather than assign() so the redirect does not land in history —
 * otherwise the back button returns here and immediately bounces forward again.
 */
(function () {
  var APP_STORE = 'https://apps.apple.com/app/6741828224';
  var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.benjamin.gavriely.BuyCAN';

  var ua = navigator.userAgent || '';

  // iPadOS 13+ reports a Macintosh user agent, so a Mac claiming multiple
  // touch points is really an iPad. Without this check every modern iPad
  // falls through to the desktop branch.
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  // Exclude Windows Phone, whose UA historically also contained "Android".
  var isAndroid = /Android/.test(ua) && !/Windows Phone/.test(ua);

  if (isIOS) {
    location.replace(APP_STORE);
  } else if (isAndroid) {
    location.replace(PLAY_STORE);
  } else {
    // Desktop or unrecognised: show both rather than guess wrong.
    document.documentElement.className = 'choose';
  }
})();
</script>

<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.5rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #FCFFFF; color: #323232; text-align: center; padding: 2rem;
  }
  @media (prefers-color-scheme: dark) { body { background: #151515; color: #FEFFFF; } }
  h1 { font-size: 1.6rem; margin: 0; }
  p { margin: 0; color: #7F7F7F; }

  /* Hidden while a redirect is in flight; revealed only when we don't redirect. */
  .fallback { display: none; flex-direction: column; align-items: center; gap: 1.5rem; }
  html.choose .fallback { display: flex; }

  .stores { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
  a.store {
    display: inline-block; padding: .85rem 1.4rem; border-radius: 12px;
    background: #FF3410; color: #fff; text-decoration: none; font-weight: 600;
  }
  a.store:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
</style>

<noscript>
  <!-- No JavaScript means no detection, so always show the choice. -->
  <style> .fallback { display: flex !important; } </style>
</noscript>
</head>
<body>

  <div class="fallback">
    <h1>Get BuyCAN</h1>
    <p>Choose your platform:</p>
    <div class="stores">
      <a class="store" href="https://apps.apple.com/app/6741828224">Download on iPhone</a>
      <a class="store"
         href="https://play.google.com/store/apps/details?id=com.benjamin.gavriely.BuyCAN">Get it on Android</a>
    </div>
  </div>

</body>
</html>
